<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Server Login | ALAMIN HOSTING</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { background:rgba(255,255,255,0.05); backdrop-filter:blur(10px); padding:40px;
    border-radius:20px; width:100%; max-width:420px;
    border:1px solid rgba(255,255,255,0.1); box-shadow:0 20px 60px rgba(0,0,0,0.4); }
  h1 { color:#fff; text-align:center; margin-bottom:8px; font-size:1.6rem; }
  .subtitle { color:#7b7ba0; text-align:center; font-size:0.8rem; margin-bottom:30px; }
  .form-group { margin-bottom:20px; }
  label { display:block; color:#b0b0d0; margin-bottom:8px; font-size:0.9rem; }
  input, select { width:100%; padding:14px; border-radius:10px;
    background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15);
    color:#fff; font-size:1rem; outline:none; transition:border-color 0.2s; }
  input:focus, select:focus { border-color:#00d4ff; box-shadow: 0 0 0 3px rgba(0,212,255,0.1); }
  select option { background:#24243e; color:#fff; }
  select option:disabled { color:#555577; }
  button { width:100%; padding:14px; border:none; border-radius:10px;
    background:linear-gradient(90deg,#00d4ff,#7b2ff7); color:#fff;
    font-size:1rem; font-weight:600; cursor:pointer; margin-top:10px;
    transition:all 0.3s; position:relative; overflow:hidden; }
  button:hover:not(:disabled) { opacity:0.9; transform:translateY(-1px); box-shadow:0 10px 25px rgba(0,212,255,0.3); }
  button:disabled { opacity:0.6; cursor:not-allowed; }
  .error { background:rgba(255,50,50,0.2); color:#ff8080; padding:12px;
    border-radius:8px; margin-bottom:20px; text-align:center; font-size:0.9rem;
    border: 1px solid rgba(255,50,50,0.3); animation: shake 0.5s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }
  .role-hint { color:#7b7ba0; font-size:0.75rem; margin-top:6px; }
  .spinner { display:inline-block; width:16px; height:16px; border:2px solid rgba(255,255,255,0.3);
    border-top-color:#fff; border-radius:50%; animation:spin 0.8s linear infinite; margin-right:8px; vertical-align:middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="card">
    <h1>🚀 Server Login</h1>
    <p class="subtitle">ALAMIN HOSTING PANEL</p>
    
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    
    <form method="POST" autocomplete="off" id="loginForm" novalidate>
      <div class="form-group">
        <label></label>
        <select name="role" required id="roleSelect" onchange="updateFields()" autocomplete="off">
          <option value="admin">1️⃣ Denger Server</option>
          <option value="file_server" selected>2️⃣ File Server</option>
          <option value="html_server">3️⃣ HTML Server</option>
          <option value="api_server">4️⃣ API Server</option>
        </select>
        <div class="role-hint" id="roleHint">File Server: username + password দিয়ে login করুন।</div>
      </div>
      <div class="form-group">
        <label id="userLabel">👤 Username</label>
        <input type="text" name="username" id="userInput" required placeholder="server-username"
               autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      </div>
      <div class="form-group">
        <label>🔑 Password</label>
        <input type="password" name="password" id="passInput" required placeholder="••••••••"
               autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly')">
      </div>
      <button type="submit" id="loginBtn">Sign In</button>
    </form>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', function() {
        const emailInput = document.getElementById('userInput');
        const passInput = document.getElementById('passInput');

        if (emailInput) {
            emailInput.value = '';
            emailInput.setAttribute('autocomplete', 'off');
        }
        if (passInput) {
            passInput.value = '';
            passInput.setAttribute('autocomplete', 'new-password');
        }

        setTimeout(() => {
            if (passInput) passInput.removeAttribute('readonly');
        }, 100);

        // পেজ লোড হওয়ার সাথে সাথেই File Server অনুযায়ী ফিল্ড সেট
        updateFields();
    });

    function updateFields() {
      const role = document.getElementById('roleSelect').value;
      const label = document.getElementById('userLabel');
      const input = document.getElementById('userInput');
      const hint = document.getElementById('roleHint');

      if (role === 'admin') {
        label.textContent = '👤 Username';
        input.placeholder = 'Denger-username';
        input.type = 'text';
        hint.textContent = '';
      } else if (role === 'file_server') {
        label.textContent = '👤 Username';
        input.placeholder = 'server-username';
        input.type = 'text';
        hint.textContent = '';
      } else if (role === 'html_server') {
        label.textContent = '👤 Username';
        input.placeholder = 'html-username';
        input.type = 'text';
        hint.textContent = '';
      } else if (role === 'api_server') {
        label.textContent = '👤 Username';
        input.placeholder = 'api-username';
        input.type = 'text';
        hint.textContent = '';
      } else {
        label.textContent = '👤 Username';
        input.placeholder = 'server-username';
        input.type = 'text';
        hint.textContent = 'এই role এখনো চালু হয়নি।';
      }
      input.value = '';
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Signing in...';
    });
  </script>
</body>
</html>
